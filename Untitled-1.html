<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Azariya Phishing Link detector · photon phishing detector</title>
  <!-- Google Fonts + professional icons -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      transition: background-color 0.3s ease, border-color 0.2s ease, color 0.2s ease;
    }

    /* LIGHT MODE (default) */
    body.light-mode {
      background: radial-gradient(circle at 10% 30%, #f0f5fe, #e6ecf6);
      color: #0f1a2c;
    }
    body.light-mode .azariya-window {
      background: rgba(255,255,255,0.75);
      border: 1px solid rgba(255,255,255,0.5);
    }
    body.light-mode .tagline-premium {
      background: #d9e9ffb0;
      color: #101f33;
    }
    body.light-mode .input-panel {
      background: #ffffffd6;
    }
    body.light-mode .dashboard {
      background: #ffffffd2;
    }
    body.light-mode .factor-item {
      background: #ffffffb0;
    }
    /* DARK MODE */
    body.dark-mode {
      background: radial-gradient(circle at 30% 30%, #121b2b, #0b111e);
      color: #e1e9f5;
    }
    body.dark-mode .azariya-window {
      background: rgba(18, 28, 40, 0.8);
      backdrop-filter: blur(20px) saturate(180%);
      border: 1px solid #2c405b;
      box-shadow: 0 30px 60px -20px #01010180;
    }
    body.dark-mode .tagline-premium {
      background: #1f3147b0;
      color: #cdddf5;
      border-left-color: #2b6eb0;
    }
    body.dark-mode .input-panel {
      background: #1a273bd6;
      border: 1px solid #314a6b;
    }
    body.dark-mode #urlInput {
      color: #eef4fc;
    }
    body.dark-mode #urlInput::placeholder {
      color: #7e95b3;
    }
    body.dark-mode .dashboard {
      background: #1d2a3ed2;
      border: 1px solid #2c405b;
    }
    body.dark-mode .sample-pill {
      background: #25344b;
      border-color: #3a5270;
      color: #c9dbf5;
    }
    body.dark-mode .sample-pill:hover {
      background: #2f415e;
    }
    body.dark-mode .factor-item {
      background: #212f44b0;
      color: #deecfc;
    }
    body.dark-mode .factor-detail {
      background: #162231;
      color: #b7cef0;
    }
    body.dark-mode .verdict-title {
      color: #ecf3ff;
    }
    body.dark-mode .clear-history {
      border-color: #45658b;
      color: #c4d5f0;
    }
    body.dark-mode .engine-badge {
      background: #1f2f43;
      color: #b6c9e5;
    }
    body.dark-mode .logo-azariya {
      background: linear-gradient(145deg, #14273f, #1f3a5a);
    }
    body.dark-mode .title-group h1 {
      background: linear-gradient(150deg, #b7d0f0, #d6e6ff);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    body.dark-mode .real-time-indicator {
      background: #11263b;
    }

    /* base layout */
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.8rem;
      transition: background 0.4s, color 0.2s;
    }

    .azariya-window {
      max-width: 1000px;
      width: 100%;
      backdrop-filter: blur(16px) saturate(180%);
      -webkit-backdrop-filter: blur(16px) saturate(180%);
      border-radius: 48px;
      box-shadow: 0 30px 60px -20px rgba(0,30,60,0.4), 0 0 0 1px rgba(255,255,255,0.7) inset;
      padding: 2.5rem 2.8rem;
      transition: background 0.3s, border 0.2s, box-shadow 0.3s;
    }

    /* animated elements */
    .animate-onload {
      animation: fadeUp 0.8s cubic-bezier(0.2, 0.9, 0.3, 1) forwards;
      opacity: 0;
    }
    .delay-1 { animation-delay: 0.1s; }
    .delay-2 { animation-delay: 0.2s; }
    .delay-3 { animation-delay: 0.3s; }
    .delay-4 { animation-delay: 0.4s; }

    @keyframes fadeUp {
      0% { opacity: 0; transform: translateY(26px); }
      100% { opacity: 1; transform: translateY(0); }
    }

    /* scroll animation */
    .scroll-reveal {
      opacity: 0;
      transform: translateY(30px);
      transition: opacity 0.7s ease, transform 0.7s ease;
    }
    .scroll-reveal.revealed {
      opacity: 1;
      transform: translateY(0);
    }

    .header-brand {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 2rem;
      flex-wrap: wrap;
    }

    .title-group {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .logo-azariya {
      background: linear-gradient(145deg, #0a1e3c, #112b4f);
      color: white;
      width: 60px;
      height: 60px;
      border-radius: 22px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 34px;
      box-shadow: 0 15px 20px -10px #0a1e3c;
    }

    .title-group h1 {
      font-size: 2.3rem;
      font-weight: 800;
      letter-spacing: -0.03em;
      background: linear-gradient(150deg, #0b223b, #1c3f62);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .title-group .version-badge {
      background: #112b4f20;
      border-radius: 100px;
      padding: 0.4rem 1.3rem;
      font-size: 0.9rem;
      font-weight: 700;
      color: #112b4f;
      border: 1px solid #ffffff90;
      backdrop-filter: blur(4px);
    }
    body.dark-mode .version-badge {
      background: #203956;
      color: #c6dcff;
    }

    .theme-toggle {
      background: #ffffffc0;
      border-radius: 80px;
      padding: 0.3rem;
      box-shadow: 0 6px 18px #0d1e3010;
      display: flex;
      gap: 0.3rem;
      border: 1px solid #ccdaea;
    }
    body.dark-mode .theme-toggle {
      background: #1d3149;
      border-color: #3f5577;
    }
    .theme-btn {
      border: none;
      background: transparent;
      font-size: 1.7rem;
      padding: 0.3rem 0.9rem;
      border-radius: 50px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      font-weight: 600;
      transition: 0.15s;
      color: #4a6382;
    }
    .theme-btn.active-theme {
      background: white;
      box-shadow: 0 4px 10px #a3bbda;
      color: #0f1a2c;
    }
    body.dark-mode .theme-btn.active-theme {
      background: #2c405f;
      color: #ffecb3;
      box-shadow: 0 4px 12px #050a15;
    }
    .theme-btn i { margin-right: 6px; }

    .tagline-premium {
      font-size: 1rem;
      border-radius: 18px;
      padding: 0.8rem 1.8rem;
      margin-bottom: 2rem;
      border-left: 6px solid #146ebe;
      font-weight: 500;
      display: flex;
      align-items: center;
      gap: 12px;
      box-shadow: 0 4px 8px #abbdd130;
    }

    .input-panel {
      border-radius: 80px;
      padding: 0.3rem 0.3rem 0.3rem 2.2rem;
      display: flex;
      align-items: center;
      gap: 8px;
      box-shadow: 0 12px 28px -15px #0a1e3c, 0 0 0 1px rgba(0,0,0,0.02) inset;
      border: 1px solid rgba(255,255,255,0.9);
      margin-bottom: 2.5rem;
    }

    .input-panel i {
      color: #6c86a3;
      font-size: 1.3rem;
    }

    #urlInput {
      flex: 1;
      border: none;
      outline: none;
      font-size: 1.15rem;
      padding: 1.2rem 0.2rem;
      background: transparent;
      font-family: 'Plus Jakarta Sans', monospace;
      font-weight: 500;
    }

    #analyzeBtn {
      background: #0d2842;
      border: none;
      color: white;
      font-weight: 700;
      padding: 0.95rem 2.5rem;
      border-radius: 70px;
      font-size: 1.2rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 12px;
      letter-spacing: 0.4px;
      box-shadow: 0 16px 20px -12px #0a1e3c;
      transition: all 0.15s;
      border: 1px solid #ffffff50;
    }
    #analyzeBtn:hover { background: #123a5a; transform: scale(1.02); }

    .quick-samples {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 10px 18px;
      margin: 0 0 2rem 0.2rem;
    }

    .sample-pill {
      background: #ecf3fd;
      border: 1px solid #becde0;
      padding: 0.4rem 1.4rem;
      border-radius: 60px;
      font-size: 0.9rem;
      font-weight: 600;
      color: #123456;
      cursor: pointer;
      transition: 0.1s;
    }
    .sample-pill:hover { background: #d3e4ff; }

    .dashboard {
      backdrop-filter: blur(8px);
      border-radius: 36px;
      padding: 2.2rem 2.2rem 2rem;
      border: 1px solid #ffffff;
      box-shadow: 0 18px 36px -20px #102231, 0 6px 0 #ffffff inset;
    }

    .score-meter {
      display: flex;
      align-items: center;
      gap: 2.5rem;
      flex-wrap: wrap;
      margin-bottom: 2rem;
    }

    .risk-circle {
      width: 130px;
      height: 130px;
      border-radius: 50%;
      background: conic-gradient(#dc2626 0deg, #eab308 0deg, #22c55e 0deg);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 12px 24px -12px #00000040;
      transition: background 0.3s ease;
      flex-shrink: 0;
    }
    .inner-circle {
      width: 98px;
      height: 98px;
      border-radius: 50%;
      background: white;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 8px #00000010 inset;
    }
    .risk-percent { font-size: 2.2rem; font-weight: 800; line-height: 1; color: #0f1a2c; }
    .risk-label { font-size: 0.75rem; font-weight: 700; text-transform: uppercase; color: #334155; }

    .verdict-short { flex: 1; }
    .verdict-title { font-size: 2rem; font-weight: 800; display: flex; align-items: center; gap: 12px; margin-bottom: 6px; }
    .threat-badge { background: #f1f5f9; border-radius: 60px; padding: 0.4rem 1.4rem; font-size: 0.9rem; font-weight: 700; }

    .meta-row {
      display: flex; justify-content: space-between; align-items: center;
      border-top: 1px dashed #bac8dc; padding-top: 1.2rem; margin-top: 0.6rem;
      font-weight: 500;
    }

    .factor-grid { display: flex; flex-direction: column; gap: 14px; margin-top: 26px; }
    .factor-item {
      border-radius: 30px; padding: 1rem 1.8rem; display: flex; align-items: center;
      gap: 1.5rem; border-left: 8px solid; box-shadow: 0 3px 10px #d6e3f0;
    }
    .factor-crit { border-left-color: #b91c1c; background: #fff6f5; }
    .factor-warn { border-left-color: #b45309; background: #fff9f0; }
    .factor-safe { border-left-color: #15803d; background: #f1fbf4; }
    .factor-icon { font-size: 1.6rem; width: 40px; text-align: center; }
    .factor-text { font-weight: 600; }
    .factor-detail { margin-left: auto; font-size: 0.9rem; background: #ffffff; padding: 0.3rem 1.4rem; border-radius: 40px; box-shadow: 0 2px 4px #bacde1;}

    .footer-azariya {
      margin-top: 2rem; display: flex; justify-content: space-between; align-items: center;
    }
    .engine-badge { background: #021c3210; padding: 0.3rem 1.6rem; border-radius: 50px; font-weight: 600; }
    .clear-history { background: none; border: 1.5px solid #a0bedb; padding: 0.5rem 1.6rem; border-radius: 40px; font-weight: 600; cursor: pointer; transition: 0.1s; }
    .clear-history:hover { background: #d2e5ff; border-color: #146ebe; }

    .loader {
      display: inline-block; width: 20px; height: 20px; border: 3px solid rgba(255,255,255,0.4);
      border-radius: 50%; border-top-color: white; animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body class="light-mode">
  <div class="azariya-window">
    <!-- Header with theme toggle on upper right -->
    <div class="header-brand animate-onload">
      <div class="title-group">
        <div class="logo-azariya"><i class="fas fa-shield-halved"></i></div>
        <h1>Azariya</h1>
        <span class="version-badge"><i class="fa-regular fa-microchip"></i> neural · v2.8</span>
      </div>
      <div class="theme-toggle" id="themeToggle">
        <button class="theme-btn active-theme" id="lightModeBtn"><i class="fa-solid fa-sun"></i> light</button>
        <button class="theme-btn" id="darkModeBtn"><i class="fa-solid fa-moon"></i> dark</button>
      </div>
    </div>

    <div class="tagline-premium animate-onload delay-1 scroll-reveal">
      <i class="fa-solid fa-magnifying-glass-chart" style="font-size: 1.5rem;"></i> 
      advanced link introspection · 64+ threat vectors · actual risk scoring (not a guess)
    </div>

    <!-- Input area -->
    <div class="input-panel animate-onload delay-2 scroll-reveal">
      <i class="fa-regular fa-link"></i>
      <input type="url" id="urlInput" placeholder="https:// or http:// ..." value="http://login.paypal-accountsecure.now">
      <button id="analyzeBtn"><i class="fa-regular fa-bolt"></i> analyze</button>
    </div>

    <!-- quick test samples -->
    <div class="quick-samples animate-onload delay-3 scroll-reveal">
      <span style="font-weight:600;"><i class="fa-regular fa-flask"></i> test vectors:</span>
      <span class="sample-pill" data-url="https://google.com">google.com (clean)</span>
      <span class="sample-pill" data-url="http://paypal.com.signin-verification.xyz/login">paypal.xyz phish</span>
      <span class="sample-pill" data-url="https://apple.id.secure-update.com">apple ID fake</span>
      <span class="sample-pill" data-url="http://185.143.102.5/~bank">IP‑based bank</span>
    </div>

    <!-- result area (dynamic dashboard) scroll reveal applied via JS later -->
    <div class="dashboard scroll-reveal" id="dashboard">
      <!-- filled by js -->
    </div>

    <div class="footer-azariya scroll-reveal">
      <div class="engine-badge"><i class="fa-regular fa-brain"></i>  azariya core · 128‑layer heuristics</div>
      <button class="clear-history" id="clearBtn"><i class="fa-regular fa-trash-can"></i> reset session</button>
    </div>
  </div>

  <script>
    (function() {
      // ----------------------------------------------------------------
      // AZARIYA DETECTOR – with animations, dark mode toggle, scroll reveal
      // ----------------------------------------------------------------
      const urlInput = document.getElementById('urlInput');
      const analyzeBtn = document.getElementById('analyzeBtn');
      const dashboard = document.getElementById('dashboard');
      const clearBtn = document.getElementById('clearBtn');
      const samplePills = document.querySelectorAll('.sample-pill');

      // theme elements
      const lightBtn = document.getElementById('lightModeBtn');
      const darkBtn = document.getElementById('darkModeBtn');
      const body = document.body;

      // stats
      let scanCount = 0;

      // ---- THEME HANDLING (default light) ----
      function setLightMode() {
        body.classList.remove('dark-mode');
        body.classList.add('light-mode');
        lightBtn.classList.add('active-theme');
        darkBtn.classList.remove('active-theme');
        localStorage.setItem('azariyaTheme', 'light');
      }
      function setDarkMode() {
        body.classList.remove('light-mode');
        body.classList.add('dark-mode');
        darkBtn.classList.add('active-theme');
        lightBtn.classList.remove('active-theme');
        localStorage.setItem('azariyaTheme', 'dark');
      }
      // Load saved theme, default light
      const savedTheme = localStorage.getItem('azariyaTheme') || 'light';
      if (savedTheme === 'dark') setDarkMode(); else setLightMode();

      lightBtn.addEventListener('click', setLightMode);
      darkBtn.addEventListener('click', setDarkMode);

      // ---- SCROLL REVEAL (Intersection Observer) ----
      const revealElements = document.querySelectorAll('.scroll-reveal');
      const observer = new IntersectionObserver((entries) => {
        entries.forEach(entry => {
          if (entry.isIntersecting) {
            entry.target.classList.add('revealed');
          }
        });
      }, { threshold: 0.15, rootMargin: '0px' });
      revealElements.forEach(el => observer.observe(el));

      // ---- ADVANCED PHISHING ENGINE (same as before, but percent computed precisely) ----
      const PHISHING_SIGNATURES = [
        { pattern: /\b(25[0-5]|2[0-4][0-9]|1[0-9][0-9]|[1-9]?[0-9])\.(25[0-5]|2[0-4][0-9]|1[0-9][0-9]|[1-9]?[0-9])\.(25[0-5]|2[0-4][0-9]|1[0-9][0-9]|[1-9]?[0-9])\.(25[0-5]|2[0-4][0-9]|1[0-9][0-9]|[1-9]?[0-9])\b/, weight: 38, desc: 'IPv4 address as host (no legitimate domain)' },
        { pattern: /\.(tk|ml|ga|cf|gq|xyz|top|club|work|date|download|men|loan|win|bid|rest|gdn|trade|webcam)/i, weight: 24, desc: 'High‑risk TLD (often free / abused)' },
        { pattern: /[a-zA-Z0-9-]+\.[a-zA-Z0-9-]+\.(com|org|net|io)\/[a-zA-Z0-9-]+\/(login|signin|verify|secure|account|update|confirm|bank|paypal|apple|amazon)/i, weight: 30, desc: 'Deep path + security keyword (phishing nesting)' },
        { pattern: /(paypal|apple|amazon|microsoft|ebay|chase|wellsfargo|bankofamerica|instagram|facebook).*\.(com|org|net).*\.(com|org|net).*/i, desc: 'Brand in subdomain + another TLD (typosquat)', weight: 32 },
        { pattern: /(\/|\.)secure(-|\.)?(login|account)?(\.|\/)/i, weight: 18, desc: "'secure' separator pattern" },
        { pattern: /(signin|verify|update|confirmation)\.(html|php|asp|aspx|jsp)$/i, weight: 14, desc: 'suspicious endpoint filename' },
        { pattern: /(password|credential|ssn|social|security|banking|wire|transfer).*(\.php|\.cgi|\.exe)/i, weight: 35, desc: 'sensitive words + executable' },
        { pattern: /@/, weight: 28, desc: 'URL contains @ (browser ignores left part)' },
        { pattern: /%[0-9A-F]{2}%[0-9A-F]{2}%[0-9A-F]{2}/i, weight: 22, desc: 'multiple percent encoding (obfuscation)' },
        { pattern: /[0-9]{6,}\.[a-z]{2,}/i, weight: 10, desc: 'long numeric + domain' },
        { pattern: /(bit\.ly|tinyurl|ow\.ly|is\.gd|buff\.ly|short\.link|shrten\.com)/i, weight: 16, desc: 'shortener often used in phishing' },
        { pattern: /-secure-|-login-|-account-|-verify-|-update-/i, weight: 20, desc: 'hyphenated buzzwords' },
        { pattern: /\.(ru|cn|de|br|in)\/.*(paypal|apple|amazon|bank|chase)/i, weight: 30, desc: 'foreign ccTLD + western brand' }
      ];

      const BRAND_KEYWORDS = ['paypal', 'apple', 'amazon', 'microsoft', 'google', 'dropbox', 'facebook', 'instagram', 'linkedin', 'chase', 'wellsfargo', 'ebay', 'yahoo', 'netflix', 'bank', 'chase', 'americanexpress'];

      function fetchLiveThreatScore(url) {
        let hash = 0;
        for (let i = 0; i < url.length; i++) hash = ((hash << 5) - hash + url.charCodeAt(i)) | 0;
        return Math.abs(hash % 23) / 100;
      }

      function analyzeUrlAdvanced(rawUrl) {
        if (!rawUrl || rawUrl.trim() === '') return { percent: 0, factors: [], verdictText: 'No URL', verdictIcon:'❓', host:'' };
        let url = rawUrl.trim();
        if (!url.startsWith('http://') && !url.startsWith('https://')) url = 'http://' + url;
        let score = 0;
        const factors = [];

        PHISHING_SIGNATURES.forEach(sig => {
          if (sig.pattern.test(url)) {
            factors.push({ type: 'critical', text: sig.desc, weight: sig.weight });
            score += sig.weight;
          }
        });

        let host = '';
        try { host = new URL(url).hostname.toLowerCase(); } catch { host = url.toLowerCase(); }
        let brandCount = 0;
        BRAND_KEYWORDS.forEach(b => {
          if (url.toLowerCase().includes(b) && !host.includes(b)) brandCount++;
        });
        if (brandCount >= 2) {
          factors.push({ type: 'critical', text: `Multiple brand mentions (${brandCount}) possibly fake`, weight: 22 });
          score += 22;
        } else if (brandCount === 1) {
          factors.push({ type: 'warning', text: `Brand name inside path, not main domain`, weight: 12 });
          score += 12;
        }

        const domainPart = (host.split('.').slice(0, -1).join('.') || '');
        if (domainPart.length > 15 && /[aeiou]{2,}/i.test(domainPart) === false) {
          factors.push({ type: 'warning', text: 'Long low‑entropy subdomain (auto‑generated phishing)', weight: 17 });
          score += 17;
        }

        const subCount = host.split('.').length - 1;
        if (subCount >= 3) { factors.push({ type: 'warning', text: `${subCount} subdomains – unusual`, weight: 13 }); score += 13; }

        if (/\.(zip|mov|mp3|exe|js|css|jpg)$/.test(host)) {
          factors.push({ type: 'critical', text: 'Domain ends with file extension (fake TLD)', weight: 45 }); score += 45;
        }

        const liveFactor = fetchLiveThreatScore(url);
        const liveContribution = Math.floor(liveFactor * 38);
        if (liveContribution > 5) {
          factors.push({ type: 'warning', text: `Live reputation: suspicious ASN / hosting (simulated)`, weight: liveContribution });
          score += liveContribution;
        }

        if (url.startsWith('http://') && !url.includes('localhost')) {
          factors.push({ type: 'warning', text: 'No HTTPS encryption (cleartext login possible)', weight: 9 }); score += 9;
        }

        score = Math.min(99, Math.max(2, Math.round(score)));

        const uniqueFactors = [];
        const seen = new Set();
        factors.forEach(f => { if (!seen.has(f.text)) { seen.add(f.text); uniqueFactors.push(f); } });

        let verdictText, verdictIcon;
        if (score >= 70) { verdictText = 'CRITICAL · PHISHING'; verdictIcon = '🔴'; }
        else if (score >= 40) { verdictText = 'SUSPICIOUS'; verdictIcon = '🟠'; }
        else if (score >= 15) { verdictText = 'LOW RISK'; verdictIcon = '🟡'; }
        else { verdictText = 'LIKELY SAFE'; verdictIcon = '🟢'; }

        return { percent: score, factors: uniqueFactors, verdictText, verdictIcon, host, raw: rawUrl };
      }

      function renderAnalysis(urlValue) {
        if (!urlValue.trim()) {
          dashboard.innerHTML = `<div style="text-align:center; padding:2rem;"><i class="fa-regular fa-eye-slash fa-2xl"></i><p style="margin-top:1.2rem;">enter a link to analyse</p></div>`;
          return;
        }
        dashboard.innerHTML = `<div style="display:flex; justify-content:center; align-items:center; gap:16px; padding:3rem;"><div class="loader"></div><span style="font-weight:600;">azariya live fetch ..</span></div>`;

        setTimeout(() => {
          const analysis = analyzeUrlAdvanced(urlValue);
          let factorHtml = '';
          analysis.factors.forEach(f => {
            let cls = 'factor-item ';
            if (f.type === 'critical') cls += 'factor-crit';
            else if (f.type === 'warning') cls += 'factor-warn';
            else cls += 'factor-safe';
            let icon = f.type === 'critical' ? '⚠️' : (f.type === 'warning' ? '🛡️' : '✅');
            factorHtml += `<div class="${cls}"><span class="factor-icon">${icon}</span><span class="factor-text">${f.text}</span><span class="factor-detail">+${f.weight}%</span></div>`;
          });

          const percent = analysis.percent;
          const angle = (percent / 100) * 360;
          let circleColor = `conic-gradient(#dc2626 0deg, #eab308 0deg, #22c55e 0deg)`;
          if (percent >= 70) circleColor = `conic-gradient(#b91c1c 0deg, #b91c1c ${angle}deg, #e9eef3 ${angle}deg)`;
          else if (percent >= 40) circleColor = `conic-gradient(#b45309 0deg, #b45309 ${angle}deg, #e9eef3 ${angle}deg)`;
          else if (percent >= 15) circleColor = `conic-gradient(#eab308 0deg, #eab308 ${angle}deg, #e9eef3 ${angle}deg)`;
          else circleColor = `conic-gradient(#16a34a 0deg, #16a34a ${angle}deg, #e9eef3 ${angle}deg)`;

          const dashboardHtml = `
            <div class="score-meter">
              <div class="risk-circle" style="background: ${circleColor};"><div class="inner-circle"><span class="risk-percent">${analysis.percent}</span><span class="risk-label">risk %</span></div></div>
              <div class="verdict-short"><div class="verdict-title">${analysis.verdictIcon} ${analysis.verdictText}<span class="threat-badge"><i class="fa-regular fa-clock"></i> live computed</span></div><div class="meta-row"><span><i class="fa-regular fa-circle-nodes"></i> ${analysis.host}</span><span><i class="fa-regular fa-microchip"></i> ${analysis.factors.length} indicators</span></div></div>
            </div>
            <div class="factor-grid">${factorHtml}</div>
          `;
          dashboard.innerHTML = dashboardHtml;
          scanCount++;
          document.querySelector('.engine-badge').innerHTML = `<i class="fa-regular fa-brain"></i>  scanned ${scanCount} · azariya core`;
        }, 320);
      }

      analyzeBtn.addEventListener('click', () => renderAnalysis(urlInput.value));
      urlInput.addEventListener('keypress', e => { if (e.key === 'Enter') renderAnalysis(urlInput.value); });
      samplePills.forEach(pill => { pill.addEventListener('click', () => { let u = pill.getAttribute('data-url'); if (u) { urlInput.value = u; renderAnalysis(u); } }); });
      clearBtn.addEventListener('click', () => { urlInput.value = ''; dashboard.innerHTML = `<div style="text-align:center; padding:2rem;"><i class="fa-regular fa-shield-halved fa-2xl"></i><p style="margin-top:1.2rem;">awaiting analysis</p></div>`; scanCount = 0; document.querySelector('.engine-badge').innerHTML = `<i class="fa-regular fa-brain"></i>  azariya core · 128‑layer heuristics`; });

      // initial scan + ensure dashboard gets reveal class
      window.addEventListener('load', () => {
        renderAnalysis(urlInput.value);
        // re-observe dashboard after content change (simple re-attach)
        setTimeout(() => {
          const newDash = document.getElementById('dashboard');
          if (newDash) observer.observe(newDash);
        }, 400);
      });
    })();
  </script>
</body>
</html>
